<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-L91T00TK4K"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-L91T00TK4K');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGL - تسجيل الدخول</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap');
        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
        }
    </style>
</head>
<body class="min-height-screen flex flex-col min-h-screen text-gray-800"> 

    <div class="flex-grow flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full transition-all duration-300">
            <div class="text-center mb-8">
                <h1 class="text-4xl font-bold text-blue-600 tracking-wider">SGL</h1>
                <p class="text-gray-500 mt-2 text-sm">بوابتك لمتابعة الطقس لحظة بلحظة</p>
            </div>

            <div class="flex border-b border-gray-200 mb-6">
                <button id="loginTab" class="w-1/2 pb-3 text-center font-semibold text-blue-600 border-b-2 border-blue-600 focus:outline-none">تسجيل الدخول</button>
                <button id="registerTab" class="w-1/2 pb-3 text-center font-semibold text-gray-400 border-b-2 border-transparent hover:text-gray-600 focus:outline-none">حساب جديد</button>
            </div>

            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">البريد الإلكتروني</label>
                    <input type="email" id="loginEmail" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-right" placeholder="name@example.com">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">كلمة المرور</label>
                    <input type="password" id="loginPassword" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-right" placeholder="••••••••">
                </div>
                <button type="submit" id="loginBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-lg transition duration-200">دخول</button>
            </form>

            <form id="registerForm" class="space-y-4 hidden">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">الاسم الكامل</label>
                    <input type="text" id="regName" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-right" placeholder="يحيى خيري">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">البريد الإلكتروني</label>
                    <input type="email" id="regEmail" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-right" placeholder="name@example.com">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">كلمة المرور</label>
                    <input type="password" id="regPassword" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-right" placeholder="••••••••">
                </div>
                <button type="submit" id="regBtn" class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-2 rounded-lg transition duration-200">إنشاء الحساب</button>
            </form>

            <div class="relative flex py-5 items-center">
                <div class="flex-grow border-t border-gray-300"></div>
                <span class="flex-shrink mx-4 text-gray-400 text-sm">أو عبر</span>
                <div class="flex-grow border-t border-gray-300"></div>
            </div>

            <button id="googleBtn" class="w-full flex items-center justify-center gap-2 border border-gray-300 hover:bg-gray-50 text-gray-700 font-medium py-2 rounded-lg transition duration-200">
                <svg class="w-5 h-5" viewBox="0 0 24 24">
                    <path fill="#EA4335" d="M12.24 10.285V14.4h6.887c-.648 2.41-2.519 4.113-5.111 4.113-3.414 0-6.173-2.759-6.173-6.173s2.759-6.173 6.173-6.173c1.558 0 2.978.58 4.07 1.532l3.054-3.054C19.345 2.22 15.986 1 12.24 1 5.48 1 0 6.48 0 13.24s5.48 12.24 12.24 12.24c6.76 0 11.7-4.755 11.7-11.7 0-.58-.06-1.125-.165-1.636l-11.535-.015z"/>
                </svg>
                تسجيل الدخول بحساب Google
            </button>
            
            <div id="statusMessage" class="mt-4 text-center text-sm font-semibold hidden"></div>
        </div>
    </div>

    <footer class="bg-black text-white text-center py-4 text-sm tracking-wide">
        جميع الحقوق محفوظة &copy;2026 المطور يحيى خيري
    </footer>

    <script>
        // إعداد Supabase
        const SUPABASE_URL = 'https://euhmytkcmwcuyngbwhwg.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_tGQS13Ng8umCsAGD3Pyyuw_Q14EDwpQ';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const loginTab = document.getElementById('loginTab');
        const registerTab = document.getElementById('registerTab');
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const googleBtn = document.getElementById('googleBtn');
        const statusMessage = document.getElementById('statusMessage');

        // التحقق من وجود جلسة نشطة عند تحميل الصفحة
        window.onload = async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                window.location.href = 'setup.html';
            }
        };

        loginTab.addEventListener('click', () => {
            loginTab.className = "w-1/2 pb-3 text-center font-semibold text-blue-600 border-b-2 border-blue-600 focus:outline-none";
            registerTab.className = "w-1/2 pb-3 text-center font-semibold text-gray-400 border-b-2 border-transparent hover:text-gray-600 focus:outline-none";
            loginForm.classList.remove('hidden');
            registerForm.classList.add('hidden');
            hideStatus();
        });

        registerTab.addEventListener('click', () => {
            registerTab.className = "w-1/2 pb-3 text-center font-semibold text-green-600 border-b-2 border-green-600 focus:outline-none";
            loginTab.className = "w-1/2 pb-3 text-center font-semibold text-gray-400 border-b-2 border-transparent hover:text-gray-600 focus:outline-none";
            registerForm.classList.remove('hidden');
            loginForm.classList.add('hidden');
            hideStatus();
        });

        function showStatus(text, isSuccess) {
            statusMessage.innerText = text;
            statusMessage.className = `mt-4 text-center text-sm font-semibold ${isSuccess ? 'text-green-600' : 'text-red-500'}`;
            statusMessage.classList.remove('hidden');
        }

        function hideStatus() {
            statusMessage.classList.add('hidden');
        }

        // إنشاء حساب جديد عبر Supabase
        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim().toLowerCase();
            const password = document.getElementById('regPassword').value;

            showStatus('جاري إنشاء الحساب...', true);

            const { data, error } = await supabaseClient.auth.signUp({
                email: email,
                password: password,
                options: {
                    data: { full_name: name }
                }
            });

            if (error) {
                showStatus(error.message, false);
            } else {
                showStatus('تم إنشاء الحساب بنجاح! يرجى مراجعة بريدك الإلكتروني للتأكيد.', true);
                registerForm.reset();
            }
        });

        // تسجيل الدخول عبر Supabase
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim().toLowerCase();
            const password = document.getElementById('loginPassword').value;

            showStatus('جاري تسجيل الدخول...', true);

            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (error) {
                showStatus('البريد الإلكتروني أو كلمة المرور غير صحيحة!', false);
            } else {
                localStorage.setItem('sgl_current_session', email);
                window.location.href = 'setup.html';
            }
        });

        // تسجيل الدخول عبر حساب Google بواسطة Supabase OAuth
        googleBtn.addEventListener('click', async () => {
            const { data, error } = await supabaseClient.auth.signInWithOAuth({
                provider: 'google',
                options: {
                    redirectTo: window.location.origin + '/setup.html'
                }
            });

            if (error) {
                showStatus(error.message, false);
            }
        });
    </script>
</body>
</html>
