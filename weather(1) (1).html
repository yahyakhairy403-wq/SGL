        .dash-title h1 { font-size: 32px; color: #fff; font-weight: 800; }
        .dash-title p { color: #9ca3af; font-size: 14px; margin-top: 5px; }

        .weather-status-box img { width: 80px; height: 80px; }
        .status-text { font-size: 24px; font-weight: bold; color: #3b82f6; }
        .features-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-top: 20px; }
        .feature-item { background: #111827; border: 1px solid #1f2937; padding: 20px; border-radius: 12px; text-align: center; transition: 0.3s; }
        .feature-item:hover { border-color: #3b82f6; transform: translateY(-3px); }
        .feature-item span { display: block; font-size: 13px; color: #9ca3af; margin-bottom: 8px; }
        .feature-item strong { font-size: 20px; color: #fff; }
        .forecast-section { margin-top: 30px; }
        .forecast-title { font-size: 18px; font-weight: bold; margin-bottom: 15px; color: #10b981; }

        .forecast-card { min-width: 130px; flex: 1; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); border-radius: 12px; padding: 15px; text-align: center; }

        .top-controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 10px; flex-wrap: wrap; }

        .btn-alert.active { background: #dc2626; border-color: #ef4444; }
        .btn-compare { background: #1f2937; border: 1px solid #374151; color: #f3f4f6; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-size: 13px; transition: 0.3s; }

        .btn-danger { background: #991b1b; border: none; color: white; padding: 10px 18px; border-radius: 8px; font-size: 13px; cursor: pointer; }

        window.onload = function() {
            const session = localStorage.getItem('sgl_current_session');
            if(!session) { window.location.href = "index.html"; return; }
            const settings = JSON.parse(localStorage.getItem(`sgl_settings_${session}`));
            if(!settings) { window.location.href = "setup.html"; return; }

            tempUnit = settings.unit; userLang = settings.language.code;
            applyTranslation(userLang);
            document.getElementById('userDisplay').innerText = translations[userLang].userPrefix + session;
            document.getElementById('countrySelect').value = settings.country.code;
            buildRegionsList(settings.country.code);



        }

        function applyTranslation(l) {
            const t = translations[l] || translations['en'];
            document.getElementById('tr-side-title').innerText = t.sideTitle;
            document.getElementById('tr-country-label').innerText = t.countryLabel;
            document.getElementById('tr-welcome').innerText = t.welcome;
            document.getElementById('tr-welcome-sub').innerText = t.welcomeSub;
            document.getElementById('tr-humidity').innerText = t.humidity;
            document.getElementById('tr-wind').innerText = t.wind;
            document.getElementById('tr-visibility').innerText = t.visibility;
            document.getElementById('tr-uv').innerText = t.uv;
            document.getElementById('tr-forecast-title').innerText = t.forecast;
            document.getElementById('tr-back-setup').innerText = t.backSetup;
            document.getElementById('tr-logout').innerText = t.logout;
            
            
            document.dir = l === 'ar' ? 'rtl' : 'ltr';
        }

        function buildRegionsList(code) {
    const config = countryNamesDatabase[code];
    document.getElementById('regionLabel').innerText = config.label;
    const s = document.getElementById('regionSelect');
    s.innerHTML = '<option value="">-- اختر --</option>';
    config.cities.forEach(c => { const o = document.createElement('option'); o.value = `${c},${code}`; o.innerText = c; s.appendChild(o); });
    document.getElementById('weatherDashboard').style.display = 'none';
    document.getElementById('welcomeMessage').style.display = 'block';
        }

        function onCountryChange(c) { buildRegionsList(c); }


        function toggleAlerts() {
            isAlertOn = !isAlertOn;
            const btn = document.getElementById('alertBtn');
            const t = translations[userLang] || translations['en'];
            btn.innerText = isAlertOn ? t.alertOn : t.alertOff;
            btn.classList.toggle('active', isAlertOn);
            if(isAlertOn) playSound();
        }


        function playSound() { document.getElementById('alertSound').play().catch(() => {}); }

        async function getDashboardWeatherData(city) {
            if(!city) return;
            const res = await fetch(`https://api.weatherapi.com/v1/forecast.json?key=${apiKey}&q=${city}&days=3&lang=${userLang}`);
            const data = await res.json();
            document.getElementById('welcomeMessage').style.display = 'none';
            document.getElementById('weatherDashboard').style.display = 'block';
 
            const c = data.current, l = data.location, t = translations[userLang] || translations['en'];
            document.getElementById('detLocation').innerText = `${l.name}, ${l.country}`;
            document.getElementById('detTime').innerText = t.updatePrefix + c.last_updated;
            const temp = tempUnit === "C" ? c.temp_c : c.temp_f;
            document.getElementById('detTemp').innerText = `${temp}°${tempUnit}`;
            document.getElementById('detIcon').src = c.condition.icon;
            document.getElementById('detCondition').innerText = c.condition.text;
            document.getElementById('detHumidity').innerText = c.humidity + '%';
            document.getElementById('detWind').innerText = c.wind_kph + t.windUnit;
            document.getElementById('detVisibility').innerText = c.vis_km + t.visUnit;
            document.getElementById('detUV').innerText = c.uv;

            const container = document.getElementById('forecastContainer');
            container.innerHTML = '';
            data.forecast.forecastday.forEach(d => {
                const dv = document.createElement('div'); dv.className = 'forecast-card';
                const dt = tempUnit === "C" ? d.day.avgtemp_c : d.day.avgtemp_f;
                dv.innerHTML = `<div class="day-name">${d.date}</div><img src="${d.day.condition.icon}"><div class="forecast-temp">${dt}°${tempUnit}</div>`;
                container.appendChild(dv);
            });

            if(isAlertOn && ((lastCond && lastCond !== c.condition.text) || (lastTemp && lastTemp !== temp))) playSound();
            lastTemp = temp; lastCond = c.condition.text;
        }



        function logoutSystem() {
            localStorage.removeItem('sgl_current_session');
            localStorage.removeItem('sgl_current_user');
            window.location.href = "index.html";
        }
